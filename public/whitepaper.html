<style>
:root{--bg:#f7f7f4;--panel:#fff;--ink:#16181d;--muted:#5d6370;--line:#e3e3dd;--accent:#1f6f5c;--accent-ink:#fff;--warn:#a2521b;--ok:#1f6f5c;--bad:#b42318;--code:#f0f0ea;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--panel:#181b20;--ink:#e8e9ec;--muted:#9aa1ad;--line:#2a2f37;--accent:#4cc3a0;--accent-ink:#0b1a15;--code:#1f232a;--warn:#e0a060;--ok:#4cc3a0;--bad:#f07167}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent)}main{max-width:1080px;margin:0 auto;padding:32px 20px 80px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.brand{font-weight:700;letter-spacing:-.01em;font-size:18px}.brand span{color:var(--accent)}
nav a{margin-left:18px;text-decoration:none;color:var(--muted)}nav a:hover{color:var(--ink)}
h1{font-size:clamp(28px,4.5vw,44px);line-height:1.1;letter-spacing:-.02em;margin:8px 0 14px}
h2{font-size:22px;letter-spacing:-.01em;margin:40px 0 12px}h3{font-size:16px;margin:0 0 8px}
p.lead{font-size:18px;color:var(--muted);max-width:720px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
pre,code{font-family:var(--mono);font-size:13px}pre{background:var(--code);border-radius:10px;padding:14px;overflow-x:auto;margin:8px 0}
.diagram{white-space:pre;font-family:var(--mono);font-size:13px;line-height:1.35;background:var(--code);border-radius:10px;padding:16px;overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:currentColor}.pill.bad{color:var(--bad);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}
.targets{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.targets span{font-family:var(--mono);font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:var(--code)}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:18px 0}
.tabs button{border:none;background:none;border-bottom:2px solid transparent;border-radius:0;color:var(--muted)}.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.big{font-size:28px;font-weight:700;letter-spacing:-.02em}
.note{font-size:13px;color:var(--muted)}.err{color:var(--bad);font-size:13px}
.snippets .tabs{margin:8px 0 0}

article{max-width:820px;margin:0 auto}
article h1{font-size:clamp(30px,5vw,46px)} article h2{margin-top:48px;padding-top:12px;border-top:1px solid var(--line)} article h3{margin-top:28px}
article p,article li{font-size:16px;line-height:1.7} article img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--line);margin:18px 0 6px}
article table{margin:14px 0} article td,article th{white-space:normal;vertical-align:top}
article blockquote{margin:0;padding:4px 16px;border-left:3px solid var(--accent);color:var(--muted)}
article pre{font-size:13px} article code{background:var(--code);padding:1px 5px;border-radius:5px} article pre code{background:none;padding:0}
.mermaid{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:16px 0;overflow-x:auto;text-align:center}
.toc{font-size:14px;color:var(--muted)} .toc a{text-decoration:none}
#loading{color:var(--muted)} article hr{display:none}
</style></head><body><main>
<header class="top"><div class="brand"><a href="/home" style="text-decoration:none;color:inherit">Decentralised<span>.si</span></a></div><nav><a href="/home">Home</a><a href="/download">Download</a><a href="/node">Run a node</a><a href="/benefits">Benefits</a><a href="/whitepaper.md">Markdown</a><a href="/app">Open app</a></nav></header>
<article id="doc"><p id="loading">Loading whitepaper…</p><noscript><p>This page renders <a href="/whitepaper.md">whitepaper.md</a>; open it directly to read without JavaScript.</p></noscript></article>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
(async () => {
  const doc = document.getElementById("doc");
  try {
    const md = await (await fetch("/whitepaper.md")).text();
    doc.innerHTML = marked.parse(md, { gfm: true });
    doc.querySelectorAll("table").forEach((t) => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); });
    doc.querySelectorAll("h2, h3").forEach((h) => { h.id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); });
    doc.querySelectorAll("pre > code.language-mermaid").forEach((c) => { const d = document.createElement("div"); d.className = "mermaid"; d.textContent = c.textContent; c.parentElement.replaceWith(d); });
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral", securityLevel: "strict", fontFamily: "ui-sans-serif, system-ui, sans-serif" });
    // Render one diagram at a time with unique ids; concurrent runs can collide.
    let n = 0;
    for (const el of doc.querySelectorAll(".mermaid")) {
      const { svg } = await mermaid.render(`wp-diagram-${n++}`, el.textContent);
      el.innerHTML = svg;
    }
    if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
  } catch (e) {
    doc.innerHTML = '<p>Could not render the whitepaper. <a href="/whitepaper.md">Read the Markdown version</a>.</p>';
  }
})();
</script></body></html>
