<title id="t">PAI supply projection</title>
<desc id="d">Total supply rises from the 500M genesis allocation, peaks near 691M PAI when fee burn overtakes emission around year 2.7, then declines. Daily emission falls with halvings and network growth; daily burn rises with usage.</desc>
